name: Test and publish Tetris
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tetris-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public CLI
        run: python tools/install-cli.py
      - run: npm ci
      - run: npm run runtime
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: pocketrealms validate .
      - name: Deploy validated game
        env:
          POCKETREALMS_API_KEY: ${{ secrets.POCKETREALMS_API_KEY }}
        run: pocketrealms --json deploy . --visibility public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          retention-days: 7
